<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternConnect - Forgot Password</title>
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<!-- Color Scheme -->
<body class="bg-slate-100 text-slate-800">

<!-- Forgot Password -->
      <section id="tab-forgotpw" class="bg-slate-50">
        <div class="flex min-h-screen items-center justify-center p-6">
          <div class="w-full max-w-sm">
            <button id="backToLoginFromForgot" class="text-[12px] text-slate-500 hover:text-slate-700 mb-4"><i class="fa-solid fa-arrow-left mr-1.5"></i>Back to sign in</button>
            <h2 class="text-xl font-bold text-slate-900">Reset your password</h2>
            <p class="text-[12.5px] text-slate-500 mt-1.5 mb-5">Enter your school email and we'll send you a link to reset your password.</p>
            <!-- Success Message -->
            <div id="forgotPwSent" class="hidden items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-[12px] rounded-md px-3 py-2.5 mb-4">
              <i class="fa-solid fa-circle-check"></i><span>Reset link sent! Check your inbox.</span>
            </div>
            <!-- Email Input and Send Button -->
            <div class="space-y-3">
              <div>
                <label class="text-[12px] font-medium text-slate-600 block mb-1">School email</label>
                <input type="text" placeholder="you@sjc.edu.ph" class="w-full border border-slate-300 rounded-md px-3 py-2.5 text-[13px] focus:outline-none focus:ring-2 focus:ring-sky-400">
              </div>
              <button id="sendResetLinkBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-[13.5px] font-semibold py-2.5 rounded-md transition">Send Reset Link</button>
            </div>
          </div>
        </div>
      </section>

<!-- Toast Container -->
<div id="toastContainer"></div>

<script src="script.js"></script>
</body>
</html>
